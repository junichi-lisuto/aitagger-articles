<!-- Unbounceページに埋め込むコード。カスタムHTML/スクリプト要素にそのまま貼り付ける -->
<!-- 記事の更新はこのリポジトリのarticles.jsonをpushするだけで反映される。Unbounce側の再編集は不要 -->
<!-- デザイン: Codex案（dev/codex-workspace/design/mockups/2026-09-16_記事メディアページ_モックアップ.html）を実データ結合 -->
<div id="aa-media-root">
  <header class="am-header">
    <div class="am-wrap am-header__row">
      <a class="am-logo" href="#aa-media-root" aria-label="AIタッガー AI検索を知る トップ">
        <span class="am-logo__mark">AI</span><span>タッガー</span><span class="am-logo__sub">AI検索を知る</span>
      </a>
      <span class="am-header__note">AIタッガーご利用者向け情報</span>
    </div>
  </header>

  <main>
    <section class="am-intro">
      <div class="am-wrap">
        <h1>AI検索で、商品が<br class="am-pc-break">見つかるしくみを知る。</h1>
        <p>Google・楽天・Yahoo!・ChatGPTの変化から、ECの商品発見に関わる情報だけを整理してお届けします。</p>
      </div>
    </section>

    <nav class="am-nav" aria-label="記事カテゴリ">
      <div class="am-wrap am-nav__row" id="am-tabs"></div>
    </nav>

    <section class="am-feed" aria-labelledby="am-feed-title">
      <div class="am-wrap">
        <div class="am-feed__heading">
          <h2 id="am-feed-title">最新の記事</h2>
          <p id="am-count" aria-live="polite"></p>
        </div>
        <div id="am-articles" class="am-articles" aria-live="polite"></div>
        <p id="am-empty" class="am-empty" hidden>該当する記事はありません。</p>
        <div class="am-more-row"><button id="am-more" class="am-more" type="button" hidden>さらに記事を表示</button></div>
      </div>
    </section>
  </main>

  <footer class="am-footer">
    <div class="am-wrap am-footer__row"><span>© 2026 LISUTO</span><span>AIタッガーをご契約のお客様向けページです</span></div>
  </footer>
</div>

<style>
  #aa-media-root{
    --am-blue:#2563EB; --am-heading:#1E3A8A; --am-ink:#0F172A; --am-muted:#475569; --am-soft:#64748B;
    --am-line:#E2E8F0; --am-tint:#F8FAFC; --am-ai:#2563EB; --am-seo:#7C3AED; --am-rakuten:#DC2626; --am-yahoo:#D97706;
    color:var(--am-ink); background:#fff; font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
    font-size:16px; line-height:1.75; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  #aa-media-root *{box-sizing:border-box}
  #aa-media-root [hidden]{display:none!important}
  #aa-media-root a{color:inherit}
  #aa-media-root button{font:inherit}
  #aa-media-root ::selection{background:#DBEAFE;color:var(--am-heading)}
  #aa-media-root .am-wrap{width:min(1160px,100%);margin-inline:auto;padding-inline:28px}
  #aa-media-root .am-header{border-bottom:1px solid var(--am-line);background:#fff}
  #aa-media-root .am-header__row{height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  #aa-media-root .am-logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-size:16px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
  #aa-media-root .am-logo__mark{display:grid;place-items:center;width:29px;height:23px;border-radius:5px;background:var(--am-blue);color:#fff;font-size:11px;letter-spacing:.04em}
  #aa-media-root .am-logo__sub{padding-left:11px;border-left:1px solid var(--am-line);color:var(--am-soft);font-size:12px;font-weight:500}
  #aa-media-root .am-header__note{color:var(--am-soft);font-size:12px}

  #aa-media-root .am-intro{padding:56px 0 48px;background:var(--am-tint);border-bottom:1px solid var(--am-line)}
  #aa-media-root .am-intro h1{max-width:760px;margin:0;color:var(--am-heading);font-size:clamp(30px,4.2vw,48px);font-weight:800;letter-spacing:-.035em;line-height:1.3}
  #aa-media-root .am-intro p{max-width:650px;margin:18px 0 0;color:var(--am-muted);font-size:15px;line-height:1.9}

  #aa-media-root .am-nav{background:#fff;border-bottom:1px solid var(--am-line);position:sticky;top:0;z-index:5}
  #aa-media-root .am-nav__row{min-height:58px;display:flex;align-items:stretch;gap:0;overflow-x:auto;scrollbar-width:thin}
  #aa-media-root .am-tab{appearance:none;flex:none;position:relative;border:0;background:transparent;color:var(--am-muted);padding:0 18px;cursor:pointer;font-size:13px;font-weight:700;white-space:nowrap}
  #aa-media-root .am-tab::after{position:absolute;right:18px;bottom:0;left:18px;height:3px;background:transparent;content:""}
  #aa-media-root .am-tab:hover{color:var(--am-heading)}
  #aa-media-root .am-tab.is-active{color:var(--am-heading)}
  #aa-media-root .am-tab.is-active::after{background:var(--am-blue)}
  #aa-media-root .am-tab:focus-visible,#aa-media-root .am-more:focus-visible,#aa-media-root .am-card:focus-visible{outline:3px solid #93C5FD;outline-offset:-3px}

  #aa-media-root .am-feed{padding:43px 0 76px}
  #aa-media-root .am-feed__heading{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--am-heading)}
  #aa-media-root .am-feed__heading h2{margin:0;color:var(--am-heading);font-size:22px;line-height:1.3;letter-spacing:-.02em}
  #aa-media-root .am-feed__heading p{margin:0;color:var(--am-soft);font-size:12px}
  #aa-media-root .am-articles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:38px}
  #aa-media-root .am-card{display:grid;grid-template-columns:156px minmax(0,1fr);gap:18px;padding:23px 0;border-bottom:1px solid var(--am-line);text-decoration:none;transition:background-color .16s ease,transform .16s ease}
  #aa-media-root .am-card:hover{background:var(--am-tint);transform:translateX(3px)}
  #aa-media-root .am-card--lead{grid-column:1 / -1;grid-template-columns:minmax(280px,1.15fr) minmax(300px,1fr);gap:34px;padding-top:0;padding-bottom:30px}
  #aa-media-root .am-thumb{display:block;aspect-ratio:16/10;overflow:hidden;background:#EFF6FF}
  #aa-media-root .am-card--lead .am-thumb{aspect-ratio:16/9}
  #aa-media-root .am-thumb svg,#aa-media-root .am-thumb img{display:block;width:100%;height:100%;object-fit:cover}
  #aa-media-root .am-copy{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
  #aa-media-root .am-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;color:var(--am-soft);font-size:11px;line-height:1.35}
  #aa-media-root .am-badge{display:inline-flex;align-items:center;padding:3px 7px;border-radius:4px;color:#fff;font-size:10px;font-weight:800;letter-spacing:.02em;line-height:1.25}
  #aa-media-root .am-badge.ai{background:var(--am-ai)} #aa-media-root .am-badge.seo{background:var(--am-seo)} #aa-media-root .am-badge.rakuten{background:var(--am-rakuten)} #aa-media-root .am-badge.yahoo{background:var(--am-yahoo)}
  #aa-media-root .am-title{margin:0;color:var(--am-ink);font-size:16px;font-weight:800;letter-spacing:-.012em;line-height:1.55}
  #aa-media-root .am-card--lead .am-title{font-size:clamp(20px,2.1vw,28px);line-height:1.48;letter-spacing:-.025em}
  #aa-media-root .am-card:hover .am-title{color:var(--am-blue)}
  #aa-media-root .am-points{margin:10px 0 0;padding:0;list-style:none;color:var(--am-muted);font-size:12px;line-height:1.65}
  #aa-media-root .am-points li{position:relative;padding-left:11px;margin-top:3px}
  #aa-media-root .am-points li::before{position:absolute;top:.72em;left:0;width:4px;height:4px;border-radius:50%;background:var(--am-soft);content:""}
  #aa-media-root .am-empty{padding:56px 0;text-align:center;color:var(--am-soft);font-size:14px}
  #aa-media-root .am-more-row{display:flex;justify-content:center;padding-top:34px}
  #aa-media-root .am-more{border:1px solid var(--am-heading);border-radius:5px;background:#fff;color:var(--am-heading);padding:10px 24px;cursor:pointer;font-size:13px;font-weight:800;transition:background-color .16s ease,color .16s ease}
  #aa-media-root .am-more:hover{background:var(--am-heading);color:#fff}
  #aa-media-root .am-footer{border-top:1px solid var(--am-line);padding:25px 0;color:var(--am-soft);font-size:12px}
  #aa-media-root .am-footer__row{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  @media(max-width:760px){
    #aa-media-root .am-wrap{padding-inline:20px}
    #aa-media-root .am-articles{grid-template-columns:1fr}
    #aa-media-root .am-card--lead{grid-column:auto;grid-template-columns:210px minmax(0,1fr);gap:18px;padding-top:0}
    #aa-media-root .am-card--lead .am-thumb{aspect-ratio:16/10}
    #aa-media-root .am-card--lead .am-title{font-size:18px}
  }
  @media(max-width:560px){
    #aa-media-root{font-size:15px}
    #aa-media-root .am-wrap{padding-inline:16px}
    #aa-media-root .am-header__row{height:56px}
    #aa-media-root .am-header__note{display:none}
    #aa-media-root .am-intro{padding:35px 0 31px}
    #aa-media-root .am-intro h1{font-size:29px;line-height:1.36;letter-spacing:-.03em}
    #aa-media-root .am-pc-break{display:none}
    #aa-media-root .am-intro p{margin-top:14px;font-size:13px;line-height:1.8}
    #aa-media-root .am-nav__row{min-height:52px;padding:0 4px}
    #aa-media-root .am-tab{padding:0 12px;font-size:12px}
    #aa-media-root .am-tab::after{right:12px;left:12px}
    #aa-media-root .am-feed{padding:29px 0 52px}
    #aa-media-root .am-feed__heading{margin-bottom:5px;padding-bottom:11px}
    #aa-media-root .am-feed__heading h2{font-size:19px}
    #aa-media-root .am-card,#aa-media-root .am-card--lead{grid-template-columns:116px minmax(0,1fr);gap:13px;padding:16px 0}
    #aa-media-root .am-card:first-child{padding-top:12px}
    #aa-media-root .am-card--lead .am-title,#aa-media-root .am-title{font-size:15px;line-height:1.5}
    #aa-media-root .am-meta{gap:6px;margin-bottom:6px;font-size:10px}
    #aa-media-root .am-badge{font-size:9px;padding:3px 6px}
    #aa-media-root .am-points{display:none}
    #aa-media-root .am-card:hover{transform:none}
    #aa-media-root .am-footer{padding:20px 0;font-size:11px}
  }
  @media(prefers-reduced-motion:reduce){#aa-media-root *{transition:none!important}}
</style>

<script>
(function(){
  var FEED_URL = "https://junichi-lisuto.github.io/aitagger-articles/articles.json";
  var PAGE_SIZE = 12;
  var CATEGORIES = [
    {key:"all",label:"すべて"},{key:"ai",label:"AI検索"},{key:"seo",label:"SEO"},
    {key:"rakuten",label:"楽天AI"},{key:"yahoo",label:"Yahoo!AI"}
  ];

  var THUMBS = {
    ai:'<svg viewBox="0 0 640 360" aria-hidden="true"><rect width="640" height="360" fill="#EFF6FF"/><path d="M74 262c73-104 142-157 219-157 74 0 137 33 202 107" fill="none" stroke="#BFDBFE" stroke-width="32" stroke-linecap="round"/><circle cx="274" cy="165" r="73" fill="none" stroke="#2563EB" stroke-width="11"/><path d="m328 220 82 82" stroke="#2563EB" stroke-width="11" stroke-linecap="round"/><path d="M453 105h106M453 139h74M453 173h106" stroke="#93C5FD" stroke-width="12" stroke-linecap="round"/></svg>',
    seo:'<svg viewBox="0 0 640 360" aria-hidden="true"><rect width="640" height="360" fill="#F5F3FF"/><path d="m312 61 22 55 55 22-55 22-22 55-22-55-55-22 55-22z" fill="#7C3AED"/><path d="m466 161 14 35 35 14-35 14-14 35-14-35-35-14 35-14z" fill="#C4B5FD"/><path d="M98 285h444" stroke="#DDD6FE" stroke-width="14" stroke-linecap="round"/></svg>',
    rakuten:'<svg viewBox="0 0 640 360" aria-hidden="true"><rect width="640" height="360" fill="#FEF2F2"/><circle cx="320" cy="180" r="97" fill="none" stroke="#DC2626" stroke-width="11"/><path d="M320 121v118M261 180h118" stroke="#DC2626" stroke-width="11" stroke-linecap="round"/><path d="M98 289h444" stroke="#FECACA" stroke-width="14" stroke-linecap="round"/></svg>',
    yahoo:'<svg viewBox="0 0 640 360" aria-hidden="true"><rect width="640" height="360" fill="#FFFBEB"/><circle cx="320" cy="180" r="97" fill="none" stroke="#D97706" stroke-width="11"/><path d="M267 180h106M320 127v106" stroke="#D97706" stroke-width="11" stroke-linecap="round"/><path d="M98 289h444" stroke="#FDE68A" stroke-width="14" stroke-linecap="round"/></svg>'
  };

  var state = { articles: [], category: "all", visible: PAGE_SIZE };

  function esc(value){
    return String(value).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function thumbHtml(a){
    if (a.thumbnail && a.thumbnail.type === "image" && a.thumbnail.url){
      return '<img src="' + esc(a.thumbnail.url) + '" alt="" loading="lazy">';
    }
    var cat = (a.thumbnail && a.thumbnail.category) || a.category;
    return THUMBS[cat] || THUMBS.ai;
  }

  function current(){
    if (state.category === "all") return state.articles;
    return state.articles.filter(function(a){ return a.category === state.category; });
  }

  function renderTabs(){
    var root = document.getElementById("am-tabs");
    root.innerHTML = CATEGORIES.map(function(c){
      return '<button class="am-tab' + (c.key === state.category ? ' is-active' : '') + '" type="button" data-category="' + c.key + '">' + esc(c.label) + '</button>';
    }).join("");
    Array.prototype.forEach.call(root.querySelectorAll("button"), function(button){
      button.addEventListener("click", function(){
        state.category = button.getAttribute("data-category");
        state.visible = PAGE_SIZE;
        renderTabs();
        renderArticles();
      });
    });
  }

  function card(article, index){
    var points = (article.bullets || []).map(function(point){ return "<li>" + esc(point) + "</li>"; }).join("");
    return (
      '<a class="am-card' + (index === 0 ? ' am-card--lead' : '') + '" href="' + esc(article.url) + '" target="_blank" rel="noopener">' +
        '<span class="am-thumb">' + thumbHtml(article) + '</span>' +
        '<span class="am-copy">' +
          '<span class="am-meta">' +
            '<span class="am-badge ' + esc(article.category) + '">' + esc(article.categoryLabel) + '</span>' +
            '<span>' + esc(article.source) + '</span>' +
            '<span>' + esc(article.date) + '</span>' +
          '</span>' +
          '<strong class="am-title">' + esc(article.title) + '</strong>' +
          '<ul class="am-points">' + points + '</ul>' +
        '</span>' +
      '</a>'
    );
  }

  function renderArticles(){
    var list = current();
    var shown = list.slice(0, state.visible);
    var root = document.getElementById("am-articles");
    var empty = document.getElementById("am-empty");
    var more = document.getElementById("am-more");

    root.innerHTML = shown.map(card).join("");
    empty.hidden = list.length > 0;
    more.hidden = state.visible >= list.length;
    document.getElementById("am-count").textContent = list.length ? list.length + "件の記事" : "";
    syncHeight();
  }

  // Unbounceはページ/ブロック/このCustom HTML要素の高さをpx固定値でCSSに焼き込む仕様で、
  // コンテンツの増減に自動追随しない。このHTML要素がページ最下部にある前提で、
  // 実際に描画された高さぶんだけ #lp-code-14 / #lp-pom-block-11 / #lp-pom-root を都度書き換える。
  function syncHeight(){
    requestAnimationFrame(function(){
      var content = document.getElementById("aa-media-root");
      if (!content) return;
      var height = content.getBoundingClientRect().height;

      var code = content.closest(".lp-code");
      if (code) code.style.height = height + "px";

      var block = content.closest(".lp-pom-block");
      if (block) block.style.height = height + "px";

      var root = document.getElementById("lp-pom-root");
      if (root) root.style.height = height + "px";
    });
  }

  function init(data){
    state.articles = (data && data.articles) || [];
    renderTabs();
    renderArticles();
    document.getElementById("am-more").addEventListener("click", function(){
      state.visible += PAGE_SIZE;
      renderArticles();
    });
    window.addEventListener("resize", syncHeight);
  }

  fetch(FEED_URL, { cache: "no-store" })
    .then(function(res){ return res.json(); })
    .then(init)
    .catch(function(){
      var empty = document.getElementById("am-empty");
      empty.textContent = "記事一覧の読み込みに失敗しました。時間をおいて再度お試しください。";
      empty.hidden = false;
      syncHeight();
    });
})();
</script>
