<script>
(function(){
  var FEED_URL = "https://junichi-lisuto.github.io/aitagger-articles/articles.json";
  var PAGE_SIZE = 12;

  var PLATFORMS = [
    {key:"all",label:"すべて"},{key:"google",label:"Google"},{key:"chatgpt",label:"ChatGPT"},
    {key:"rakuten",label:"楽天"},{key:"yahoo",label:"Yahoo!"},{key:"other-ai",label:"その他AI検索"},
    {key:"amazon",label:"Amazon"}
  ];

  var THEME_LABELS = {
    visibility:"検索結果・購買導線の変化",
    optimization:"商品情報・タグ付けの対策",
    measurement:"計測・分析"
  };
  var MAIN_THEME = "visibility";
  var SIDE_THEME = "measurement";
  var WIDE_THEME = "optimization";
  var THEME_ORDER = [MAIN_THEME, SIDE_THEME, WIDE_THEME];
  var SECTION_INITIAL = 6;
  var SECTION_STEP = 6;
  var SIDE_INITIAL = 10;
  var SIDE_STEP = 8;
  var MAIN_LEAD_COUNT = 1;
  var MAIN_GRID_COUNT = 2;
  var MAIN_ROW_COUNT = 3;
  var MOBILE_LEAD_COUNT = 3;
  var MOBILE_ROW_COUNT = 3;
  var HERO_COUNT = 4;
  var HERO_INTERVAL = 6000;
  var MOBILE_BREAKPOINT = 760;

  function isMobile(){
    return window.innerWidth <= MOBILE_BREAKPOINT;
  }

  function themeUrl(theme){
    var url = new URL(window.location.href);
    url.searchParams.set("theme", theme);
    url.searchParams.delete("platform");
    return url.pathname + url.search + url.hash;
  }

  function platformUrl(platform){
    var url = new URL(window.location.href);
    url.searchParams.delete("theme");
    url.searchParams.set("platform", platform);
    return url.pathname + url.search + url.hash;
  }

  function topUrl(){
    var url = new URL(window.location.href);
    url.searchParams.delete("theme");
    url.searchParams.delete("platform");
    return url.pathname;
  }

  function themeFromUrl(){
    var params = new URLSearchParams(window.location.search);
    var theme = params.get("theme");
    return THEME_LABELS[theme] ? theme : null;
  }

  function platformFromUrl(){
    var params = new URLSearchParams(window.location.search);
    var platform = params.get("platform");
    if (!platform) return null;
    return PLATFORM_LABELS[platform] ? platform : null;
  }

  var PLATFORM_LABELS = {};
  PLATFORMS.forEach(function(p){ PLATFORM_LABELS[p.key] = p.label; });

  var THUMBS = {
    google:'<svg viewBox="0 0 640 360" aria-hidden="true"><rect width="640" height="360" fill="#EFF6FF"/><path d="M74 262c73-104 142-157 219-157 74 0 137 33 202 107" fill="none" stroke="#BFDBFE" stroke-width="32" stroke-linecap="round"/><circle cx="274" cy="165" r="73" fill="none" stroke="#2563EB" stroke-width="11"/><path d="m328 220 82 82" stroke="#2563EB" stroke-width="11" stroke-linecap="round"/><path d="M453 105h106M453 139h74M453 173h106" stroke="#93C5FD" stroke-width="12" stroke-linecap="round"/></svg>',
    chatgpt:'<svg viewBox="0 0 640 360" aria-hidden="true"><rect width="640" height="360" fill="#F5F3FF"/><path d="m312 61 22 55 55 22-55 22-22 55-22-55-55-22 55-22z" fill="#7C3AED"/><path d="m466 161 14 35 35 14-35 14-14 35-14-35-35-14 35-14z" fill="#C4B5FD"/><path d="M98 285h444" stroke="#DDD6FE" stroke-width="14" stroke-linecap="round"/></svg>',
    rakuten:'<svg viewBox="0 0 640 360" aria-hidden="true"><rect width="640" height="360" fill="#FEF2F2"/><circle cx="320" cy="180" r="97" fill="none" stroke="#DC2626" stroke-width="11"/><path d="M320 121v118M261 180h118" stroke="#DC2626" stroke-width="11" stroke-linecap="round"/><path d="M98 289h444" stroke="#FECACA" stroke-width="14" stroke-linecap="round"/></svg>',
    yahoo:'<svg viewBox="0 0 640 360" aria-hidden="true"><rect width="640" height="360" fill="#FFFBEB"/><circle cx="320" cy="180" r="97" fill="none" stroke="#D97706" stroke-width="11"/><path d="M267 180h106M320 127v106" stroke="#D97706" stroke-width="11" stroke-linecap="round"/><path d="M98 289h444" stroke="#FDE68A" stroke-width="14" stroke-linecap="round"/></svg>',
    "other-ai":'<svg viewBox="0 0 640 360" aria-hidden="true"><rect width="640" height="360" fill="#EFF6FF"/><circle cx="320" cy="180" r="97" fill="none" stroke="#2563EB" stroke-width="11"/><path d="M267 180h106M320 127v106" stroke="#2563EB" stroke-width="11" stroke-linecap="round"/></svg>',
    amazon:'<svg viewBox="0 0 640 360" aria-hidden="true"><rect width="640" height="360" fill="#FFFBEB"/><path d="M120 220c120 70 280 70 400 0" fill="none" stroke="#D97706" stroke-width="14" stroke-linecap="round"/></svg>'
  };

  var state = { articles: [], visible: PAGE_SIZE, sectionVisible: {}, pageTheme: null, pagePlatform: null, heroIndex: 0 };
  var heroTimer = null;

  function esc(value){
    return String(value).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function thumbHtml(a){
    if (a.thumbnail && a.thumbnail.type === "image" && a.thumbnail.url){
      return '<img src="' + esc(a.thumbnail.url) + '" alt="" loading="lazy">';
    }
    var plat = (a.thumbnail && a.thumbnail.category) || (a.platforms && a.platforms[0]);
    return THUMBS[plat] || THUMBS.google;
  }

  function current(){
    return state.articles.filter(function(a){
      var platformOk = !state.pagePlatform || state.pagePlatform === "all" || (a.platforms || []).indexOf(state.pagePlatform) !== -1;
      var themeOk = !state.pageTheme || a.theme === state.pageTheme;
      return platformOk && themeOk;
    }).sort(function(a, b){
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    });
  }

  function renderTabs(){
    var root = document.getElementById("am-tabs");
    root.innerHTML = PLATFORMS.map(function(p){
      var isActive = !state.pageTheme && p.key === (state.pagePlatform || "all");
      return '<a class="am-tab' + (isActive ? ' is-active' : '') + '" href="' + esc(platformUrl(p.key)) + '">' + esc(p.label) + '</a>';
    }).join("");
  }

  function card(article, variant){
    var points = (article.bullets || []).map(function(point){ return "<li>" + esc(point) + "</li>"; }).join("");
    var platformLabel = (article.platforms || []).map(function(p){ return PLATFORM_LABELS[p] || p; }).join("・");
    var themeLabel = THEME_LABELS[article.theme] || article.theme;
    var variantClass = variant === true ? " am-card--lead" : variant ? " am-card--" + variant : "";
    return (
      '<a class="am-card' + variantClass + '" href="' + esc(article.url) + '" target="_blank" rel="noopener">' +
        '<span class="am-thumb">' + thumbHtml(article) + '</span>' +
        '<span class="am-copy">' +
          '<span class="am-meta">' +
            '<span class="am-meta-line">' +
              '<span class="am-badge theme-' + esc(article.theme) + '">' + esc(themeLabel) + '</span>' +
              '<span class="am-platforms">' + esc(platformLabel) + '</span>' +
            '</span>' +
            '<span class="am-meta-line am-meta-line--source">' +
              '<span>' + esc(article.source) + '</span>' +
              '<span>' + esc(article.date) + '</span>' +
            '</span>' +
          '</span>' +
          '<strong class="am-title">' + esc(article.title) + '</strong>' +
          '<ul class="am-points">' + points + '</ul>' +
        '</span>' +
      '</a>'
    );
  }

  function sortedAll(){
    return state.articles.slice().sort(function(a, b){
      return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
    });
  }

  function stopHeroTimer(){
    if (heroTimer){ clearInterval(heroTimer); heroTimer = null; }
  }

  function showHeroSlide(index){
    var root = document.getElementById("am-hero-articles");
    var dots = document.getElementById("am-hero-dots");
    var cards = root.querySelectorAll(".am-card");
    var dotEls = dots.querySelectorAll(".am-hero-dot");
    if (!cards.length) return;
    state.heroIndex = (index + cards.length) % cards.length;
    Array.prototype.forEach.call(cards, function(el, i){ el.classList.toggle("is-active", i === state.heroIndex); });
    Array.prototype.forEach.call(dotEls, function(el, i){ el.classList.toggle("is-active", i === state.heroIndex); });
  }

  function renderHero(){
    var root = document.getElementById("am-hero-articles");
    var dots = document.getElementById("am-hero-dots");
    var top = sortedAll().slice(0, HERO_COUNT);
    root.innerHTML = top.map(function(a){ return card(a, true); }).join("");
    dots.innerHTML = top.length > 1
      ? top.map(function(_, i){ return '<button class="am-hero-dot" type="button" data-index="' + i + '" aria-label="' + (i + 1) + '件目を表示"></button>'; }).join("")
      : "";
    state.heroIndex = 0;
    showHeroSlide(0);

    Array.prototype.forEach.call(dots.querySelectorAll(".am-hero-dot"), function(dot){
      dot.addEventListener("click", function(){
        stopHeroTimer();
        showHeroSlide(parseInt(dot.getAttribute("data-index"), 10));
        startHeroTimer();
      });
    });

    stopHeroTimer();
    startHeroTimer();
  }

  function startHeroTimer(){
    var root = document.getElementById("am-hero-articles");
    if (root.querySelectorAll(".am-card").length <= 1) return;
    heroTimer = setInterval(function(){ showHeroSlide(state.heroIndex + 1); }, HERO_INTERVAL);
  }

  function byTheme(theme){
    return sortedAll().filter(function(a){ return a.theme === theme; });
  }

  function sectionHeading(theme){
    var count = byTheme(theme).length;
    return (
      '<div class="am-feed__heading">' +
        '<h2><a class="am-heading-link" href="' + esc(themeUrl(theme)) + '">' + esc(THEME_LABELS[theme] || theme) + '</a></h2>' +
        '<a class="am-count-link" href="' + esc(themeUrl(theme)) + '">' + count + '件</a>' +
      '</div>'
    );
  }

  function sectionMoreRow(theme){
    return '<div class="am-section__more-row"><a class="am-section__more" href="' + esc(themeUrl(theme)) + '">もっと見る</a></div>';
  }

  function sectionBlock(theme, cardsHtml){
    return (
      '<div class="am-section">' +
        sectionHeading(theme) +
        '<div class="am-articles">' + cardsHtml + '</div>' +
        sectionMoreRow(theme) +
      '</div>'
    );
  }

  function mainSectionBlock(){
    var list = byTheme(MAIN_THEME);
    if (!list.length) return "";
    var leadShown = list.slice(0, MAIN_LEAD_COUNT);
    var gridShown = list.slice(MAIN_LEAD_COUNT, MAIN_LEAD_COUNT + MAIN_GRID_COUNT);
    var rowShown = list.slice(MAIN_LEAD_COUNT + MAIN_GRID_COUNT, MAIN_LEAD_COUNT + MAIN_GRID_COUNT + MAIN_ROW_COUNT);
    var cardsHtml =
      leadShown.map(function(a){ return card(a, true); }).join("") +
      gridShown.map(function(a){ return card(a, "grid"); }).join("") +
      rowShown.map(function(a){ return card(a, "row"); }).join("");
    return sectionBlock(MAIN_THEME, cardsHtml);
  }

  function sideSectionBlock(){
    var list = byTheme(SIDE_THEME);
    if (!list.length) return "";
    var shown = list.slice(0, SIDE_INITIAL);
    var cardsHtml = shown.map(function(a){ return card(a, "row"); }).join("");
    return sectionBlock(SIDE_THEME, cardsHtml);
  }

  function wideSectionBlock(){
    var list = byTheme(WIDE_THEME);
    if (!list.length) return "";
    var shown = list.slice(0, SECTION_INITIAL);
    var cardsHtml = shown.map(function(a){ return card(a, "grid"); }).join("");
    return '<div class="am-section am-section--wide">' + sectionHeading(WIDE_THEME) + '<div class="am-articles">' + cardsHtml + '</div>' + sectionMoreRow(WIDE_THEME) + '</div>';
  }

  function mobileSectionBlock(theme){
    var list = byTheme(theme);
    if (!list.length) return "";
    var leadShown = list.slice(0, MOBILE_LEAD_COUNT);
    var rowShown = list.slice(MOBILE_LEAD_COUNT, MOBILE_LEAD_COUNT + MOBILE_ROW_COUNT);
    var cardsHtml =
      leadShown.map(function(a){ return card(a, "mlead"); }).join("") +
      rowShown.map(function(a){ return card(a, "mrow"); }).join("");
    return sectionBlock(theme, cardsHtml);
  }

  function renderSections(){
    if (isMobile()){
      document.getElementById("am-section-main").innerHTML = mobileSectionBlock(MAIN_THEME);
      document.getElementById("am-section-side").innerHTML = mobileSectionBlock(SIDE_THEME);
      document.getElementById("am-section-wide").innerHTML = mobileSectionBlock(WIDE_THEME);
    } else {
      document.getElementById("am-section-main").innerHTML = mainSectionBlock();
      document.getElementById("am-section-side").innerHTML = sideSectionBlock();
      document.getElementById("am-section-wide").innerHTML = wideSectionBlock();
    }
  }

  function renderArticles(){
    var list = current();
    var shown = list.slice(0, state.visible);
    var root = document.getElementById("am-articles");
    var empty = document.getElementById("am-empty");
    var more = document.getElementById("am-more");
    var title = document.getElementById("am-feed-title");

    root.innerHTML = shown.map(function(a, i){ return card(a, i === 0); }).join("");
    empty.hidden = list.length > 0;
    more.hidden = state.visible >= list.length;
    document.getElementById("am-count").textContent = list.length ? list.length + "件の記事" : "";

    if (state.pageTheme){
      title.textContent = THEME_LABELS[state.pageTheme] || state.pageTheme;
    } else if (state.pagePlatform && state.pagePlatform !== "all"){
      title.textContent = (PLATFORM_LABELS[state.pagePlatform] || state.pagePlatform) + "の記事";
    } else {
      title.textContent = "記事一覧";
    }
  }

  function render(){
    var isTop = !state.pageTheme && !state.pagePlatform;
    document.getElementById("am-hero").hidden = !isTop;
    document.getElementById("am-sections").hidden = !isTop;
    document.getElementById("am-flat-wrap").hidden = isTop;
    if (isTop){
      stopHeroTimer();
      renderHero();
      renderSections();
    } else {
      stopHeroTimer();
      renderArticles();
    }
    syncHeight();
  }

  // Unbounceはページ/ブロック/このCustom HTML要素の高さをpx固定値でCSSに焼き込む仕様で、
  // コンテンツの増減に自動追随しない。このHTML要素がページ最下部にある前提で、
  // 実際に描画された高さぶんだけ #lp-code-14 / #lp-pom-block-11 / #lp-pom-root を都度書き換える。
  function syncHeight(){
    requestAnimationFrame(function(){
      var content = document.getElementById("aa-media-root");
      if (!content) return;
      var height = content.getBoundingClientRect().height;

      var code = content.closest(".lp-code");
      if (code) code.style.height = height + "px";

      var block = content.closest(".lp-pom-block");
      if (block) block.style.height = height + "px";

      var root = document.getElementById("lp-pom-root");
      if (root) root.style.height = height + "px";
    });
  }

  function init(data){
    state.articles = (data && data.articles) || [];
    state.pageTheme = themeFromUrl();
    state.pagePlatform = state.pageTheme ? null : platformFromUrl();
    document.getElementById("am-logo-link").setAttribute("href", topUrl());
    renderTabs();
    render();
    document.getElementById("am-more").addEventListener("click", function(){
      state.visible += PAGE_SIZE;
      renderArticles();
      syncHeight();
    });

    var lastIsMobile = isMobile();
    window.addEventListener("resize", function(){
      var nowMobile = isMobile();
      if (nowMobile !== lastIsMobile){
        lastIsMobile = nowMobile;
        var isTop = !state.pageTheme && !state.pagePlatform;
        if (isTop) renderSections();
      }
      syncHeight();
    });
  }

  fetch(FEED_URL, { cache: "no-store" })
    .then(function(res){ return res.json(); })
    .then(init)
    .catch(function(){
      var empty = document.getElementById("am-empty");
      empty.textContent = "記事一覧の読み込みに失敗しました。時間をおいて再度お試しください。";
      empty.hidden = false;
      syncHeight();
    });
})();
</script>
